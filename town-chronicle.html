<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Town Chronicle</title>
<style>
:root {
  --paper: #f6f1e7; --card: #fffdf8; --ink: #2a251f; --muted: #6f665a; --line: #e2d9c8; --soft: #efe7d7;
  --accent: #8a4b2a; --accent-soft: #f3e3d6; --good: #3d7a4f; --bad: #b0403a; --warn: #b07a1f; --male: #4b6f9e; --female: #a8577a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body.era-medieval { --accent: #7a3e1d; --accent-soft: #f1e0d2; }
body.era-frontier { --accent: #9a5b22; --accent-soft: #f5e5cf; }
body.era-modern { --accent: #2f5f8a; --accent-soft: #dde9f4; }
body.era-fantasy { --accent: #5b3f8c; --accent-soft: #e8e0f4; }
body.era-scifi { --accent: #1f7a7a; --accent-soft: #d6efee; }
body.era-dropped { --accent: #4f7a2e; --accent-soft: #e2eed6; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
a, .link { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover, .link:hover { text-decoration: underline; }
.dead-name { color: var(--muted); }
.dead-name::after { content: " †"; }
.gone-name { color: var(--muted); font-style: italic; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0 0 .4em; line-height: 1.2; }
h1 { font-size: 1.8rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
button, select, input { font: inherit; }
button { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: .42em .9em; border-radius: 7px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.small { padding: .2em .6em; font-size: .85em; }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=number], input[type=search], select { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: .38em .6em; color: var(--ink); }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* top bar */
#topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: .55rem 1.1rem; background: var(--ink); color: #f6f1e7; }
#topbar .brand { font-family: var(--serif); font-size: 1.15rem; letter-spacing: .02em; white-space: nowrap; }
#topbar .brand b { color: #e8c9a8; font-weight: 600; }
#topbar .where { flex: 1; font-size: .92rem; color: #d6cdbd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topbar .where strong { color: #fff; font-family: var(--serif); font-size: 1.05rem; }
#topbar button { background: transparent; color: #f6f1e7; border-color: #5a5146; }
#topbar button:hover { border-color: #e8c9a8; }
#topbar .dirty { color: #f1b48a; font-size: .82rem; }

/* layout */
#app { display: flex; min-height: calc(100vh - 48px); }
#nav { width: 196px; flex-shrink: 0; padding: 1rem .6rem; border-right: 1px solid var(--line); background: var(--soft); }
#nav button { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: .5em .75em; margin-bottom: 2px; border-radius: 7px; }
#nav button.on { background: var(--accent); color: #fff; }
#nav button:not(.on):hover { background: var(--accent-soft); }
#nav .sep { height: 1px; background: var(--line); margin: .7rem .4rem; }
#nav .note { font-size: .78rem; color: var(--muted); padding: .3em .75em; }
#main { flex: 1; padding: 1.3rem 1.8rem 4rem; min-width: 0; max-width: 1280px; }
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: .8rem; display: flex; gap: .6rem; align-items: center; }

/* cards & grids */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
.grid { display: grid; gap: 1rem; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .7rem; margin-bottom: 1rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .7rem .9rem; cursor: default; }
.stat.click { cursor: pointer; } .stat.click:hover { border-color: var(--accent); }
.stat .n { font-family: var(--serif); font-size: 1.65rem; line-height: 1.1; }
.stat .l { font-size: .82rem; color: var(--muted); }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.pill { display: inline-block; font-size: .76rem; padding: .08em .55em; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.good { background: #e3f1e6; color: var(--good); border-color: #c6e1cc; }
.pill.bad { background: #f7e2df; color: var(--bad); border-color: #ecc4bf; }
.pill.warn { background: #f7ecd6; color: var(--warn); border-color: #ecd9b0; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* tables */
table.list { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.list th { text-align: left; font-weight: 600; font-size: .82rem; color: var(--muted); background: var(--soft); padding: .5em .7em; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
table.list th.sorted::after { content: " ▾"; } table.list th.sorted.asc::after { content: " ▴"; }
table.list td { padding: .45em .7em; border-bottom: 1px solid var(--soft); vertical-align: top; }
table.list tr:hover td { background: #fbf6ec; }
table.list tr.rowlink { cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .8rem; }
.pager { display: flex; gap: .5rem; align-items: center; margin-top: .7rem; }

/* bars */
.barlist .row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(50px, 1fr) 40px; gap: .6rem; align-items: center; padding: .16rem 0; font-size: .88rem; }
.barlist .row.click { cursor: pointer; } .barlist .row.click:hover .lab { color: var(--accent); text-decoration: underline; }
.barlist .bar { display: block; height: 12px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.barlist .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.barlist .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.score { display: inline-block; width: 70px; height: 8px; background: var(--soft); border-radius: 4px; position: relative; vertical-align: middle; }
.score i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.trait { display: grid; grid-template-columns: 170px 1fr 110px; gap: .6rem; align-items: center; font-size: .9rem; margin: .2rem 0; }
.trait .bar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.trait .bar i { display: block; height: 100%; background: var(--accent); }

/* person page */
.phead { display: flex; gap: 1.1rem; align-items: flex-start; }
.avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 1.5rem; color: #fff; flex-shrink: 0; }
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin: 1rem 0; flex-wrap: wrap; }
.tabs button { border: none; background: transparent; border-bottom: 3px solid transparent; border-radius: 0; padding: .5em .9em; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.bio { font-family: var(--serif); font-size: 1.08rem; line-height: 1.65; max-width: 72ch; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { display: inline-flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: .3em .65em; cursor: pointer; min-width: 120px; }
.chip:hover { border-color: var(--accent); }
.chip .nm { font-weight: 600; font-size: .9rem; color: var(--accent); }
.chip .sub { font-size: .77rem; color: var(--muted); }
.chip.dead .nm { color: var(--muted); } .chip.dead .nm::after { content: " †"; }
.chip.away .nm { color: var(--muted); font-style: italic; }
.famsec { margin-bottom: .9rem; }
.famsec h4 { margin: 0 0 .35rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.relrow { display: grid; grid-template-columns: minmax(150px, 220px) 86px 1fr 70px; gap: .7rem; padding: .35rem 0; border-bottom: 1px solid var(--soft); align-items: center; font-size: .9rem; }
.timeline .yr { display: grid; grid-template-columns: 120px 1fr; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid var(--soft); }
.timeline .yr .when { font-family: var(--serif); font-size: 1.05rem; }
.timeline .yr .when small { display: block; color: var(--muted); font-family: var(--sans); font-size: .78rem; }
.timeline .ev { margin: .1rem 0; }
.timeline .why { color: var(--muted); font-size: .86rem; margin-left: 1rem; }
.timeline .secret { background: #fbefe6; border-left: 3px solid var(--warn); padding-left: .4rem; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: .25rem .8rem; font-size: .92rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }

/* create screen */
.welcome { max-width: 980px; margin: 1.5rem auto; }
.eras { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: .7rem; }
.eracard { border: 2px solid var(--line); border-radius: 12px; padding: .8rem 1rem; background: var(--card); cursor: pointer; }
.eracard:hover { border-color: #c9b9a0; }
.eracard.on { border-color: var(--accent); background: var(--accent-soft); }
.eracard .t { font-family: var(--serif); font-size: 1.08rem; font-weight: 600; }
.eracard .d { font-size: .84rem; color: var(--muted); }
.formrow { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; margin: 1rem 0; }
.formrow label { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--muted); }
.settings-table td { padding: .3em .5em; font-size: .88rem; border-bottom: 1px solid var(--soft); }
.settings-table input[type=number] { width: 90px; }
details summary { cursor: pointer; color: var(--accent); }
.overlay { position: fixed; inset: 0; background: rgba(42, 37, 31, .55); display: grid; place-items: center; z-index: 100; }
.overlay .box { background: var(--card); padding: 1.4rem 2rem; border-radius: 12px; font-family: var(--serif); font-size: 1.15rem; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .6rem 1.1rem; border-radius: 9px; z-index: 200; font-size: .92rem; }
.err { color: var(--bad); }
svg text { font-family: var(--sans); }
@media (max-width: 800px) { #app { flex-direction: column; } #nav { width: auto; display: flex; flex-wrap: wrap; } #nav button { width: auto; } #nav .sep, #nav .note { display: none; } #main { padding: 1rem; } .relrow { grid-template-columns: 1fr 80px; } }

#topbar button.adv { border-color: #e8c9a8; color: #fff; }
#topbar button.adv:hover { background: #4a4036; }
#topbar .tsep { width: 1px; height: 22px; background: #5a5146; margin: 0 .2rem; }
.ysum { font-family: var(--serif); font-size: 1rem; margin-bottom: .25rem; }
.season { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); width: 58px; }
.ev.minor { color: var(--muted); font-size: .9rem; }
.minibars { display: inline-flex; gap: 3px; align-items: flex-end; height: 26px; margin-top: .25rem; }
.minibars i { display: block; width: 7px; border-radius: 2px; }
.relhist { margin-top: .2rem; } .relhist summary { font-size: .8rem; color: var(--muted); } .relhist div { font-size: .82rem; color: var(--muted); padding-left: .6rem; }
.yearcard summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 130px 1fr 200px; gap: 1rem; align-items: baseline; padding: .55rem .2rem; border-bottom: 1px solid var(--soft); }
.yearcard summary::-webkit-details-marker { display: none; }
.yearcard summary .yy { font-family: var(--serif); font-size: 1.1rem; }
.yearcard[open] summary { background: var(--accent-soft); }
.yearcard .body { padding: .6rem .4rem 1rem; }
.yearcard .body h4 { margin: .6rem 0 .25rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.moodchip { display: inline-block; min-width: 46px; text-align: center; border-radius: 6px; padding: 0 .4em; font-size: .8rem; color: #fff; }
.progress { width: 320px; height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; margin: .7rem 0; }
.progress i { display: block; height: 100%; background: var(--accent); }

.vizwrap { position: relative; }
.viz { border: 1px solid var(--line); border-radius: 10px; background: #fffdf8; overflow: hidden; touch-action: none; cursor: grab; }
.viz:active { cursor: grabbing; }
.vizbtns { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; }
.tnode:hover rect:first-child { filter: brightness(0.97); stroke-width: 2.5; }
.viz g[data-mapp]:hover circle, .viz g[data-pid]:hover circle, .viz g[data-fam]:hover circle { stroke-width: 4; }

.ednum { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); gap: .15rem; }
h4.edh { margin: 1rem 0 .2rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card .formrow { margin: .5rem 0; }
textarea { font: inherit; padding: .4em .6em; border: 1px solid var(--line); border-radius: 7px; }

.vizsvg text.lbl { paint-order: stroke; stroke: #fffdf8; stroke-width: 3.5px; stroke-linejoin: round; }
.vizsvg.hl line, .vizsvg.hl g[data-ni] { opacity: .12; transition: opacity .15s; }
.vizsvg.hl line.on, .vizsvg.hl g[data-ni].on { opacity: 1; }
.vizsvg.hl line.on { stroke-width: 3; }
.tcopy:hover rect { stroke-width: 2; fill: #efe9dc; }
.tnode.flash rect:first-child { stroke: var(--accent); stroke-width: 5; }

/* ---- Stage 6: exports and printing ---- */
.vzsep { display: inline-block; width: 8px; }
.pbtns { text-align: right; margin: .5rem 0 0; }
#printArea { display: none; }
@media print {
  body.printing > *:not(#printArea) { display: none !important; }
  body.printing #printArea { display: block; }
  body.printing { background: #fff; }
}
.pdoc { font-size: 11pt; color: #222; line-height: 1.45; }
.pdoc a { color: inherit; text-decoration: none; }
.pdoc .muted { color: #666; }
.pdoc .small { font-size: 9.5pt; }
.ptitle { text-align: center; padding-top: 30vh; break-after: page; }
.ptitle h1 { font-size: 26pt; margin-bottom: .4em; }
.pcontents { break-after: page; } .pcontents ol { columns: 2; font-size: 10pt; }
.plife { break-before: page; } .plife:first-child { break-before: auto; }
.pcontents + .plife { break-before: auto; }
.plife h2 { font-size: 18pt; margin: 0 0 .2em; } .plife h3 { font-size: 12.5pt; margin: 1.1em 0 .4em; border-bottom: 1px solid #ccc; }
.ptab { border-collapse: collapse; width: 100%; } .ptab th { text-align: left; vertical-align: top; width: 28%; padding: 3px 8px 3px 0; font-weight: 600; } .ptab td { padding: 3px 0; }
.ptab tr, .pyr { break-inside: avoid; }
.pyr { display: grid; grid-template-columns: 6.5em 1fr; gap: .6em; padding: .35em 0; border-top: 1px solid #eee; }
.pwhen { font-weight: 700; } .pwhen small { display: block; font-weight: 400; color: #666; }
.pev { margin: .1em 0; } .pev.secret { font-style: italic; }
.pyear { break-inside: auto; margin-bottom: 1.2em; } .pyear h2 { font-size: 15pt; border-bottom: 2px solid #999; margin: 1em 0 .4em; break-after: avoid; }
.pyear h4 { margin: .7em 0 .3em; font-size: 11pt; break-after: avoid; }
.pdoc .chips { display: block; } .pdoc .chip { display: inline; border: 0; padding: 0; margin: 0 .8em 0 0; background: none; }
.pdoc .chip .nm { font-weight: 600; } .pdoc .chip .sub { color: #666; font-size: 9pt; margin-left: .3em; }
.pdoc .chip .nm::after { content: ''; } .pdoc .moodchip { color: #fff; padding: 0 .4em; border-radius: 4px; }
.pchart { break-after: page; }
.pdraw { font-size: 13pt; margin: 0 0 .5em; } .pdrawing svg { width: 100%; height: auto; max-height: 92vh; }
.ppage { break-after: page; } .ppage:last-child { break-after: auto; } .ppage .pdrawing svg { max-height: 165mm; }

</style>
</head>

<div id="app"><nav id="nav"></nav><main id="main"></main></div>

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- people ----------

// ---------- the empty-world arrival ----------
function performDrop(W, rng, target) {

    const friends = relsOf(W, p.id).filter(r => !r.ended && /friend/.test(r.type) && r.type !== 'old friend').length;
    const enemies = relsOf(W, p.id).filter(r => !r.ended && r.score <= -40).length;
    const sp = p.spouse ? getRel(W, p.id, p.spouse) : null;
    const h = W.households[p.household];
    const youngKids = h ? h.members.filter(id => { const q = W.people[id]; return q && ageOf(q, y) < 5; }).length : 0;
    const base = 12 - p.traits.N * 0.35 + p.traits.E * 0.12 + p.traits.A * 0.06;
    let stress = m.yearStress + youngKids * 5 + enemies * 4 + (p.occupation && /Unemployed/.test(p.occupation) ? 18 : 0) + (100 - p.health) * 0.25 + (h ? (40 - Math.min(40, h.wealth)) * 0.3 : 0);
    if (p.hermit) stress -= 5;
    m.stress = Math.round(clamp(m.stress * 0.4 + stress * 0.6, 0, 100));
    let mood = base + lawFx(W, 'mood') + m.joy * 0.8 - m.worry * 0.5 - grief * 28 - m.trauma * 0.3 - m.guilt * 0.3 - m.stress * 0.35 + Math.min(friends, 5) * 3 + (sp ? (sp.score - 50) * 0.25 : (a >= 25 && !p.hermit ? -4 : 0)) - (m.depressed ? 15 : 0) - m.drink * 0.08;
    m.mood = Math.round(clamp(m.mood * 0.35 + mood * 0.65, -100, 100));
    // trauma and guilt fade slowly
    m.trauma = Math.round(clamp(m.trauma * (0.82 + p.traits.N / 700) - friends * 0.4, 0, 100));
    m.guilt = Math.round(clamp(m.guilt * (0.8 + p.traits.C / 600), 0, 100));
    // depression
    if (!m.depressed && m.mood < -30 && a >= 12 && rng.chance(0.12 + p.traits.N / 400 + (m.mood < -55 ? 0.15 : 0))) {
      m.depressed = y; addEvent(W, p, y, 'mind', 'Sank into a deep, lasting low.', { why: moodReasons(W, p, y, grief, m).join('; ') || 'No single reason.' });
      ripple(W, rng, p, y, 'worry', 10, null);
    } else if (m.depressed && rng.chance(0.2 + Math.min(friends, 5) * 0.03 + (sp && sp.score > 50 ? 0.08 : 0) + (m.mood > -10 ? 0.2 : 0))) {
      m.depressed = false; addEvent(W, p, y, 'mind', 'Came out of a long dark time.', { why: friends >= 2 ? 'Friends and family helped.' : 'Time, mostly.' });
    }
    // drinking
    if (a >= 15) {
      const pull = lawFx(W, 'drink') * 6 + (m.stress > 55 ? 10 : 0) + (grief > 0.8 ? 8 : 0) + (m.trauma > 40 ? 6 : 0) + (m.depressed ? 6 : 0) - (p.traits.C - 50) / 6 + (W.era === 'scifi' ? -3 : 0);
      const before = m.drink;
      m.drink = Math.round(clamp(m.drink + (pull > 6 ? rng.int(3, 14) : -rng.int(4, 12)) + (m.drink > 60 ? 4 : 0), 0, 100));
      if (before <= 60 && m.drink > 60) { addEvent(W, p, y, 'mind', `Began drinking heavily.`, { why: moodReasons(W, p, y, grief, m).join('; ') || 'Habit took hold.' }); ripple(W, rng, p, y, 'worry', 12, 'Worried about {who}\'s drinking.'); }
      if (before > 60 && m.drink <= 40) addEvent(W, p, y, 'mind', 'Gave up the heavy drinking.', { why: rng.pick(['Family begged.', 'A scare with health.', 'Faith helped.', 'Friends stood by.', 'Hit bottom and climbed out.']) });
      if (m.drink > 60) p.health = Math.round(clamp(p.health - rng.int(1, 4), 1, 100));
    }
    // ageing body
    if (a > 40) p.health = Math.round(clamp(p.health - rng.range(0.2, 1.2) * (a > 70 ? 2 : 1), 1, 100));
    else if (p.health < 85) p.health = Math.round(clamp(p.health + rng.range(0, 3), 1, 100));
    // new long-term conditions with age
    if (a >= 20) for (const [c, prev] of eraOf(W).conditions) if (!p.conditions.includes(c) && rng.chance(prev / 45 * (a > 50 ? 1.6 : 0.6))) { p.conditions.push(c); addEvent(W, p, y, 'health', `Began to suffer from ${c}.`, { minor: true }); }
    // remember the year
    // old, minor memories fade away; life-defining ones stay
    if (p.memories.length > 12) p.memories = p.memories.filter(x => x.weight >= 0.85 || y - x.y < 15);
    p.hist.push([y, m.mood, p.health, m.stress, Math.round(grief * 100) / 100, m.drink, m.depressed ? 1 : 0, m.trauma, m.guilt]);
    if (p.hist.length > 400) p.hist.shift();
    sum += m.mood; n++;
  }
  R.mood = n ? Math.round(sum / n) : 0;
}
function moodReasons(W, p, y, grief, m) {
  const out = [];
  if (grief > 0.5) { const last = p.memories.filter(x => x.kind === 'loss').pop(); out.push(last ? `still grieving (${last.note})` : 'grief'); }
  if (m.trauma > 35) out.push('haunted by what happened');
  if (m.guilt > 30) out.push('weighed down by guilt');
  if (m.stress > 55) out.push('under heavy strain');
  if (p.health < 40) out.push('poor health');
  if (p.occupation && /Unemployed/.test(p.occupation)) out.push('out of work');
  return out;
}

// ---------- the year's summary ----------
function yearFinish(W, rng, y, R, startPop, outbreak, Y) {
  const pop = lives(W).length;
  const topCauses = Object.entries(R.causes).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const parts = [];
  const prevMood = W.chronicle[y - 1] ? W.chronicle[y - 1].mood : null;
  const tone = R.mood >= 15 ? 'a good year' : R.mood >= 0 ? 'an ordinary year' : R.mood >= -15 ? 'a difficult year' : 'a hard, grim year';
  parts.push(`${cap(tone)} in ${W.name}.`);
  if (Y) parts.push(econSummary(W, y, Y));
  if (outbreak && outbreak.cases) parts.push(`${cap(outbreak.d.name)} broke out in ${SEASONS[outbreak.season].toLowerCase()}: ${outbreak.cases} fell ill${outbreak.deaths ? ` and ${outbreak.deaths} died` : ''}.`);
  parts.push(`${R.births} ${R.births === 1 ? 'baby was' : 'babies were'} born and ${R.deaths} ${R.deaths === 1 ? 'person' : 'people'} died${topCauses.length ? ` (most often of ${topCauses.map(c => c[0]).slice(0, 2).join(' and ')})` : ''}.`);
  if (R.marriages) parts.push(`${R.marriages} ${R.marriages === 1 ? 'couple' : 'couples'} wed or set up home together${R.divorces ? `, and ${R.divorces} split up` : ''}.`);
  if (R.arrivals || R.departures) parts.push(`${R.arrivals} newcomers arrived and ${R.departures} moved away.`);
  for (const it of R.items) if (it.text) parts.push(it.text);
  parts.push(`The town now numbers ${pop} (${pop >= startPop ? '+' : ''}${pop - startPop}).`);
  W.chronicle[y] = {
    y, summary: parts.join(' '), mood: R.mood, moodPrev: prevMood,
    stats: { births: R.births, deaths: R.deaths, infantDeaths: R.infantDeaths, marriages: R.marriages, divorces: R.divorces, arrivals: R.arrivals, departures: R.departures, illnesses: R.illnesses, injuries: R.injuries, miscarriages: R.miscarriages, newFriends: R.newFriends, quarrels: R.quarrels, reconciled: R.reconciled, jobsStarted: R.jobsStarted, jobsLost: R.jobsLost, retired: R.retired, population: pop, start: startPop },
    weather: Y ? Y.weather : null, food: Y ? Y.food : null, price: Y ? Y.priceIndex : null,
    causes: R.causes, outbreak: outbreak && outbreak.cases ? { name: outbreak.d.name, season: outbreak.season, cases: outbreak.cases, deaths: outbreak.deaths } : null,
    items: R.items
  };
  W.yearStats[y] = Object.assign({}, W.chronicle[y].stats);
}

// ---------- a person's year in words ----------
function personYearSummary(W, p, y) {
  const evs = p.events.filter(e => e.y === y);
  const h = (p.hist || []).find(r => r[0] === y);
  const prev = (p.hist || []).find(r => r[0] === y - 1);
  if (!h) return null;
  const [, mood, health, stress, grief, drink, dep, trauma, guilt] = h;
  const word = mood >= 35 ? 'A happy year' : mood >= 12 ? 'A good year' : mood >= -8 ? 'An ordinary year' : mood >= -30 ? 'A hard year' : 'A very dark year';
  const why = [];
  if (evs.some(e => e.t === 'married' || e.t === 'partnered')) why.push('a wedding');
  if (evs.some(e => e.t === 'child_born')) why.push('a new baby');
  if (evs.some(e => e.t === 'courting')) why.push('a new romance');
  if (evs.some(e => e.t === 'loss')) why.push('a death in the family or among friends');
  if (evs.some(e => e.t === 'ill')) why.push('serious illness');
  if (evs.some(e => e.t === 'injury')) why.push('an injury');
  if (evs.some(e => e.t === 'heartbreak' || e.t === 'divorced')) why.push('heartbreak');
  if (evs.some(e => e.t === 'betrayal')) why.push('betrayal');
  if (evs.some(e => e.t === 'success')) why.push('success at work');
  if (evs.some(e => e.t === 'setback')) why.push('trouble at work');
  if (evs.some(e => e.t === 'work' && /lost|laid off/i.test(e.text))) why.push('losing work');
  if (grief > 0.5 && !evs.some(e => e.t === 'loss')) why.push('lingering grief');
  if (trauma > 40) why.push('old wounds of the mind');
  if (guilt > 30) why.push('guilt');
  if (drink > 60) why.push('heavy drinking');
  if (dep) why.push('depression');
  if (stress > 60 && !why.length) why.push('a great deal of strain');
  const trend = prev ? (mood - prev[1] > 15 ? ' Better than the year before.' : prev[1] - mood > 15 ? ' Worse than the year before.' : '') : '';
  return { word, mood, health, stress, text: `${word}${why.length ? ' — ' + why.slice(0, 4).join(', ') : ''}.${trend}` };
}

function weatherNorms(W) {
  const key = W.era + ':' + W.settings.weatherSwings;
  if (NORM_CACHE[key]) return NORM_CACHE[key];
  const table = W.era === 'scifi' ? WEATHER.scifi : WEATHER.land;
  const out = {};
  for (let s = 0; s < 4; s++) {
    const opts = table[s].map(([w, p], i) => [w, i === 0 ? p : p * W.settings.weatherSwings]);
    const tot = opts.reduce((a, b) => a + b[1], 0);
    const exp = {};
    for (const [w, p] of opts) for (const [r, f] of Object.entries(WX_EFFECT[w] || {})) exp[r] = (exp[r] || 0) + (f - 1) * p / tot;
    for (const [r, d] of Object.entries(exp)) out[r] = (out[r] || 1) * (1 + d);
  }
  return (NORM_CACHE[key] = out);
}

// ---------- income ----------

// ---------- the year's weather, harvests and events (before the seasons run) ----------
function econStart(W, rng, y, R) {

  // weather
  const table = W.era === 'scifi' ? WEATHER.scifi : WEATHER.land;

  for (const [r, name] of (PESTS[W.era] || [])) if (Y.yields[r] != null && rng.chance(0.06 * S.disasters)) { const f = rng.range(0.15, 0.6); Y.yields[r] *= f; Y.pests.push({ r, name, f }); }

  if (Y.events.some(e => e.k === 'bumper')) for (const r of Object.keys(Y.yields)) if (FOOD.has(r)) Y.yields[r] *= rng.range(1.15, 1.35);

// ---------- each season: events land, hunger bites, the cold kills ----------

      mindOf(p).yearStress += hit * 25;

function districtOf(W, rng) { const ds = Object.values(W.households).filter(h => h.dissolved == null && h.members.length).map(h => h.district); return ds.length ? rng.pick(ds) : null; }

    for (const p of people) mindOf(p).joy += 8;

  } else if (e.k === 'boom') {
    note(`${cap(e.name)} brought new money and new people.`);

// ---------- the empty world: food, shelter and discoveries ----------
function droppedRoles(W) {

  if (st.farming > 0) st.farming = Math.round(clamp(st.farming + count('Farmer') / need * 0.6, 0, 1) * 100) / 100;

      else if (k === 'mood') st.moodBoost = (st.moodBoost || 0) + v;
      else if (k === 'health') st.healthBoost = (st.healthBoost || 0) + v;
      else st[k] = Math.round(clamp((st[k] || 0) + v, 0, 1) * 100) / 100;

// ---------- money, at the end of the year ----------

}
function pyramidSVG(live, y) {

    s += `<text x="${mid}" y="${yy + rowH - 4}" font-size="9" text-anchor="middle" fill="var(--muted)">${a === 95 ? '95+' : a}</text>`;
    if (m[i]) s += `<text x="${mid - 26 - mw}" y="${yy + rowH - 4}" font-size="9" text-anchor="end" fill="var(--muted)">${m[i]}</text>`;

  if (f.district) list = list.filter(p => { const h = W.households[p.household]; return h && h.district === f.district; });

  const court = Object.values(W.rels).find(r => r.type === 'courting' && !r.ended && (r.a === p.id || r.b === p.id));
  if (court) out.push(`${He} is courting @${court.a === p.id ? court.b : court.a}.`);
  if (p.preg) out.push(`${He} is expecting a baby, due in ${SEASONS[p.preg.s].toLowerCase()}.`);
  if (m.depressed) out.push(`${He} has been in a deep low since ${m.depressed}.`);
  else if (m.mood >= 35) out.push(`Life is good for ${himHer(p)} right now.`);
  else if (m.mood <= -30) out.push(`These are dark days for ${himHer(p)}.`);
  if (last[4] > 0.6) { const l = p.memories.filter(x => x.kind === 'loss').pop(); if (l && l.who !== p.id) out.push(`${He} is still grieving @${l.who}.`); }
  if (m.trauma > 45) out.push(`${He} is haunted by what ${heShe(p)} has been through.`);
  if (m.guilt > 35) { const g = p.memories.filter(x => x.kind === 'guilt').pop(); out.push(g ? `${He} carries guilt: ${g.note}.` : `${He} carries a heavy guilt.`); }
  if (m.drink > 60) out.push(`${He} drinks far too much.`);
  return out.join(' ');
}

function trendChart() {

// ---------- history ----------
let HIST_CACHE = null;
function historyIndex() {
  if (HIST_CACHE && HIST_CACHE.key === W.id + ':' + W.year + ':' + Object.keys(W.people).length) return HIST_CACHE;
  const idx = {};
  const at = y => (idx[y] = idx[y] || { births: [], deaths: [], weddings: [], splits: [], arrivals: [], leavers: [], ill: [], hurt: [], drama: [] });
  for (const p of Object.values(W.people)) {
    for (const e of p.events) {
      if (e.secret) continue;
      const Y = at(e.y);
      if (e.t === 'born' && !/elsewhere|outside|before the family|Born on Earth/.test(e.text)) Y.births.push(p.id);
      else if ((e.t === 'married' || e.t === 'partnered')) { const m = /@(\d+)/.exec(e.text); if (m && +m[1] > p.id) Y.weddings.push([p.id, +m[1], e.t]); }
      else if (e.t === 'divorced') { const m = /@(\d+)/.exec(e.text); if (m && +m[1] > p.id) Y.splits.push([p.id, +m[1]]); }
      else if (e.t === 'arrived') Y.arrivals.push(p.id);
      else if (e.t === 'left') Y.leavers.push(p.id);
      else if (e.t === 'ill') Y.ill.push([p.id, e.text]);
      else if (e.t === 'injury') Y.hurt.push([p.id, e.text]);
      else if (['betrayal', 'withdrew', 'returned', 'guilt', 'feud', 'justice', 'scandal', 'election', 'office', 'confession', 'disaster', 'war', 'discovery'].includes(e.t) && !e.minor) Y.drama.push([p.id, e.text]);
    }
    if (p.died != null) at(p.died).deaths.push(p.id);
  }
  const years = Object.keys(idx).map(Number);
  HIST_CACHE = { key: W.id + ':' + W.year + ':' + Object.keys(W.people).length, idx, min: Math.min(...years), max: W.year - 1 };
  return HIST_CACHE;
}

function printHTML(title, html, landscape) {
  let area = document.getElementById('printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = `${landscape ? '<style>@page { size: landscape; margin: 10mm; }</style>' : '<style>@page { margin: 16mm 14mm; }</style>'}<div class="pdoc">${html}</div>`;
  const oldTitle = document.title; document.title = title;

  const done = () => { document.body.classList.remove('printing'); area.innerHTML = ''; document.title = oldTitle; window.removeEventListener('afterprint', done); };

}

// ---------- pictures of trees and maps ----------
const SVG_PROPS = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'font-size', 'font-weight', 'font-family', 'paint-order', 'stroke-linejoin', 'text-anchor'];
function staticSVG(svg) {
  svg.classList.remove('hl'); svg.querySelectorAll('.on,.flash').forEach(x => x.classList.remove('on', 'flash'));
  const W0 = +svg.dataset.w, H0 = +svg.dataset.h;
  const clone = svg.cloneNode(true);
  const A = svg.querySelectorAll('*'), B = clone.querySelectorAll('*');
  for (let i = 0; i < A.length; i++) {
    const tag = A[i].tagName.toLowerCase(); if (tag === 'title' || tag === 'g' || tag === 'style') continue;
    const cs = getComputedStyle(A[i]);
    for (const k of SVG_PROPS) { const v = cs.getPropertyValue(k); if (v && v !== 'normal' && !(k === 'stroke-dasharray' && v === 'none')) B[i].setAttribute(k, v); }
    B[i].removeAttribute('class');
  }
  // where each top-level piece sits, so a page of a big drawing only carries what is on it
  const parts = [];
  [...svg.children].forEach((o, i) => {
    const c = clone.children[i]; if (!c || o.tagName.toLowerCase() === 'title') return;
    let bb; try { bb = o.getBBox(); } catch (e) { bb = { x: 0, y: 0, width: W0, height: H0 }; }
    let dx = 0, dy = 0; const t = o.transform && o.transform.baseVal && o.transform.baseVal.consolidate(); if (t) { dx = t.matrix.e; dy = t.matrix.f; }
    parts.push({ x: bb.x + dx - 4, y: bb.y + dy - 4, w: bb.width + 8, h: bb.height + 8, el: c });
  });
  clone.removeAttribute('class'); clone.removeAttribute('style');
  clone.setAttribute('viewBox', `0 0 ${W0} ${H0}`); clone.setAttribute('width', W0); clone.setAttribute('height', H0);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.insertAdjacentHTML('afterbegin', `<rect x="0" y="0" width="${W0}" height="${H0}" fill="#fffdf8"/>`);
  return { text: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), w: W0, h: H0, el: clone, parts };
}
function pictureName(wrap) {
  const card = wrap.closest('.card'); const h = card && card.querySelector('h3'); const h1 = document.querySelector('#main h1');
  const who = nav.cur && nav.cur.view === 'person' && W.people[nav.cur.params.id] ? fullName(W.people[nav.cur.params.id]) + ' ' + ({ tree: 'family tree', map: 'connections' }[ui.personTab] || '') : (h ? h.textContent : h1 ? h1.textContent : 'drawing');
  return safeName(`${W.name} ${who} ${W.year}`);
}
async function savePicture(wrap, kind) {
  const svg = wrap.querySelector('.viz svg'); if (!svg) return;
  const done = busy(kind === 'pdf' ? 'Getting the drawing ready to print…' : 'Making the picture…');
  await new Promise(r => setTimeout(r, 30));
  try {
    const s = staticSVG(svg); const name = pictureName(wrap);
    if (kind === 'svg') { downloadBlob(new Blob([s.text], { type: 'image/svg+xml' }), name + '.svg'); toast('Saved ' + name + '.svg'); return; }
    if (kind === 'pdf') {
      // a landscape page holds about 1000 × 680 of the drawing at full size
      const PW = 1000, PH = 680; const cols = Math.ceil(s.w / PW), rows = Math.ceil(s.h / PH); const n = cols * rows;
      const title = esc(name.replace(/-/g, ' '));
      const page = (vb, label) => {
        let c;
        if (label && label.startsWith('page')) {
          const [x0, y0, w0, h0] = vb.split(' ').map(Number);
          c = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          c.insertAdjacentHTML('afterbegin', `<rect x="${x0}" y="${y0}" width="${w0}" height="${h0}" fill="#fffdf8"/>`);
          for (const pt of s.parts) if (pt.x < x0 + w0 && pt.x + pt.w > x0 && pt.y < y0 + h0 && pt.y + pt.h > y0) c.appendChild(pt.el.cloneNode(true));
        } else c = s.el.cloneNode(true);
        c.setAttribute('viewBox', vb); c.setAttribute('width', '100%'); c.removeAttribute('height'); c.setAttribute('preserveAspectRatio', 'xMinYMin meet'); return `<div class="ppage"><h2 class="pdraw">${title}${label ? ` <span class="muted">· ${label}</span>` : ''}</h2><div class="pdrawing">${c.outerHTML}</div></div>`; };
      let html = page(`0 0 ${s.w} ${s.h}`, n > 1 ? 'the whole drawing' : '');
      if (n > 1) {
        done(); const full = confirm(`At full size this drawing needs ${n} pages (${cols} across, ${rows} down).\n\nOK: print a page showing the whole drawing, then all ${n} full-size pages.\nCancel: print just the one page showing the whole drawing.`);
        if (full) { let k = 0; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { k++; html += page(`${c * PW} ${r * PH} ${PW} ${PH}`, `page ${k} of ${n} — row ${r + 1}, column ${c + 1}`); } }
      }
      printHTML(name, html, true); return;
    }
    // PNG: twice the screen size for sharpness, shrunk if the browser can't make a picture that big
    const maxDim = 16000, maxArea = 100e6;
    const k = Math.min(2, maxDim / s.w, maxDim / s.h, Math.sqrt(maxArea / (s.w * s.h)));
    const url = URL.createObjectURL(new Blob([s.text], { type: 'image/svg+xml' }));
    const img = new Image(); img.decoding = 'sync';
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('the drawing could not be turned into a picture')); img.src = url; });
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(s.w * k)); c.height = Math.max(1, Math.round(s.h * k));
    const g = c.getContext('2d'); g.fillStyle = '#fffdf8'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) throw new Error('the picture was too big for the browser');
    downloadBlob(blob, name + '.png');
    toast(k < 1 ? `Saved ${name}.png — it was shrunk to fit; use SVG for full detail.` : `Saved ${name}.png`, k < 1 ? 5000 : 2600);
  } catch (err) { alert('Could not save the picture: ' + err.message); }
  finally { done(); }
}

saveFile = async function (asNew) {
  const text = JSON.stringify(W);
  const isGz = name => /\.gz$/i.test(name || '');
  try {
    if (window.showSaveFilePicker) {
      if (!fileHandle || asNew) {
        const types = [{ description: 'Town Chronicle save', accept: { 'application/json': ['.json'] } }, { description: 'Town Chronicle save, compressed (smaller)', accept: { 'application/gzip': ['.gz'] } }];
        fileHandle = await window.showSaveFilePicker({ suggestedName: fileNameFor(), types: ui.saveCompressed ? types.reverse() : types });
      }
      const data = isGz(fileHandle.name) ? await gzipText(text) : text;
      const wr = await fileHandle.createWritable(); await wr.write(data); await wr.close();
      dirty = false; renderFrame(); toast(`Saved to ${fileHandle.name}${isGz(fileHandle.name) ? ' (compressed)' : ''}`);
      return;
    }
  } catch (err) { if (err && err.name === 'AbortError') return; console.warn('Save picker failed, downloading instead', err); }
  const nm = fileNameFor();
  downloadBlob(isGz(nm) ? new Blob([await gzipText(text)], { type: 'application/gzip' }) : new Blob([text], { type: 'application/json' }), nm);
  dirty = false; renderFrame(); toast(`Downloaded ${nm}`);
};
openFile = function () {
